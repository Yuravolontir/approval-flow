name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore ApprovalFlow.sln

      - name: Build
        run: dotnet build ApprovalFlow.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test ApprovalFlow.sln --no-build --configuration Release --verbosity normal
